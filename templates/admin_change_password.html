{% extends 'admin/master.html' %}

{% block body %}

<div style="max-width:500px;margin:40px;">

    <h3>Change Admin Username & Password</h3>

    {% if message %}

        <div style="background:#d4edda;padding:10px;border-radius:5px;margin:15px 0;">
            {{ message }}
        </div>

    {% endif %}

    <p>
        Current Username:
        <b>{{ current_user }}</b>
    </p>

    <form method="POST">

        <label>New Username</label>

        <input
            type="text"
            name="username"
            value="{{ current_user }}"
            required
            style="width:100%;padding:8px;margin:5px 0 15px 0;"
        >

        <label>New Password</label>

        <input
            type="password"
            name="password"
            placeholder="Naya password likho"
            required
            style="width:100%;padding:8px;margin:5px 0 15px 0;"
        >

        <button
            type="submit"
            style="background:#007bff;color:white;padding:10px 20px;border:none;border-radius:5px;"
        >
            Update Username & Password
        </button>

    </form>

    <br>

    <a href="/admin/logout">
        Logout
    </a>

</div>

{% endblock %}
